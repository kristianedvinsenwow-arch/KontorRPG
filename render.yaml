# Render Blueprint for KontorRPG (https://render.com/docs/blueprint-spec).
# One web service: the Node server serves the built client, /version, /health and the /ws game socket.
services:
  - type: web
    name: kontor-rpg
    runtime: node
    # Free is fine for the M0 spike (it sleeps after 15 idle minutes and has no persistent disk).
    # Switch to "starter" and add the disk below once the game stores characters (M1).
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Accounts and character storage (Supabase project "kontor-rpg", Stockholm).
      # URL and publishable key are public by design; the secret key must be pasted in Render.
      - key: SUPABASE_URL
        value: https://xblngcjarybauizqwthb.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_8TTmfljGK-EuvbFBpRG1Yg_pMbCOR8i
      - key: SUPABASE_SECRET_KEY
        sync: false # Supabase dashboard → Project Settings → API Keys → Secret keys
      - key: REQUIRE_LOGIN
        value: "false" # set to "true" once everyone has logged in once
    # disk:
    #   name: kontor-data
    #   mountPath: /var/data
    #   sizeGB: 1
