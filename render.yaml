# Render Blueprint for KontorRPG (https://render.com/docs/blueprint-spec).
# One web service: the Node server serves the built client, /version, /health and the /ws game socket.
services:
  - type: web
    name: kontor-rpg
    runtime: node
    # Characters are stored in Supabase, so no disk is needed. Free sleeps after 15 idle
    # minutes; "starter" stays awake.
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Accounts (username + PIN) and character storage (Supabase project "kontor-rpg", Stockholm).
      # Only the server talks to the database; the secret key must be pasted in Render.
      - key: SUPABASE_URL
        value: https://xblngcjarybauizqwthb.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false # Supabase dashboard → Project Settings → API Keys → Secret keys
      - key: ALLOW_GUESTS
        value: "false" # guests aren't saved and lose everything on a deploy; "true" lets them in anyway
